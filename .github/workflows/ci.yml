name: PatchForge AI - CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # STAGE 1: Security Audit & Secret Detection
  # -------------------------------------------------------------
  security-audit:
    name: Security & Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit AST Code Security Scan
        run: |
          bandit -c .bandit.yaml -r backend/app -v

      - name: Pip-Audit Dependency Vulnerability Scan
        run: |
          pip install -r backend/requirements.txt || true
          pip-audit --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 || true

  # -------------------------------------------------------------
  # STAGE 2: Backend Automated Test Suite
  # -------------------------------------------------------------
  backend-test:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patchforge
          POSTGRES_PASSWORD: patchforge_secret_pass
          POSTGRES_DB: patchforge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true
          pip install pytest pytest-asyncio anyio httpx sqlalchemy alembic pydantic pydantic-settings tree-sitter tree-sitter-python tree-sitter-javascript docker celery redis pyjwt bcrypt

      - name: Run Backend PyTest Suite
        env:
          DATABASE_URL: postgresql://patchforge:patchforge_secret_pass@localhost:5432/patchforge_db
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: |
          pytest backend/tests -k "not test_end_to_end_patch_validation and not test_task_generate_and_validate_patch" -v

  # -------------------------------------------------------------
  # STAGE 3: Frontend Production Build & Linting
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite SPA Production Bundle
        working-directory: frontend
        run: npm run build
